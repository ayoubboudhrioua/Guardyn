name: Guardyn checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GUARDYN_LLM: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      # Official benchmark adapters skip unless their separate checkouts are installed.
      # CI checks are not live model benchmark results.
      - run: python -m pytest -q
      - run: docker build -t guardyn:ci .
      - name: Container Python and dashboard entrypoint
        run: |
          docker run --rm guardyn:ci python --version | grep -q 'Python 3.12.'
          docker run --rm guardyn:ci python tools/live_dashboard.py --help | grep -q -- '--kit'
          docker run --rm guardyn:ci python -c 'import typer, rich, fastapi, uvicorn'
