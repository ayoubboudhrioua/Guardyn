name: Guardyn checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GUARDYN_LLM: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      # Official benchmark adapters skip unless their separate checkouts are installed.
      # CI checks are not live model benchmark results.
      - run: python -m pytest -q
      - run: docker build -t guardyn:ci .
      - name: Container health and dashboard
        run: |
          docker run --detach --rm --name guardyn-ci -p 127.0.0.1:8080:8080 -e GUARDYN_LLM=off guardyn:ci
          trap 'docker stop guardyn-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/ | grep -q Guardyn
